name: UI dependency audit

on:
  schedule:
    - cron: '37 3 * * *'
      timezone: Europe/Kyiv
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: UI nightly dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check Kyiv night window
        id: night_window
        shell: bash
        run: |
          hour=$(TZ=Europe/Kyiv date +%H)
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]] || (( 10#$hour < 6 )); then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "### Scheduled audit skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub delivered this scheduled run after the 00:00–06:00 Europe/Kyiv window. No dependency audit was performed. Use Run workflow for a manual audit." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.night_window.outputs.allowed == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.night_window.outputs.allowed == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        if: steps.night_window.outputs.allowed == 'true'
        run: npm ci --no-audit --no-fund
      - name: Audit application and development dependencies
        if: steps.night_window.outputs.allowed == 'true'
        run: npm audit --json > npm-audit.json
      - name: Preserve audit report even when vulnerabilities are found
        if: always() && steps.night_window.outputs.allowed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-dependency-audit
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14
